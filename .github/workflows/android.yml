name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      # The project currently has pre-existing lint debt. Keep generating the report so it is
      # visible in CI, but do not block signed dev builds until that debt is fixed in a dedicated pass.
      - name: Android lint (report legacy debt)
        continue-on-error: true
        run: gradle :app:lintDebug --stacktrace

      - name: Build PR debug APK
        if: github.event_name == 'pull_request'
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload PR test APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Audoiboo-Tracker-PR-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Decode release signing key
        if: github.event_name != 'pull_request'
        env:
          AUDOIBOO_KEYSTORE_B64: ${{ secrets.AUDOIBOO_KEYSTORE_B64 }}
          AUDOIBOO_STORE_PASSWORD: ${{ secrets.AUDOIBOO_STORE_PASSWORD }}
          AUDOIBOO_KEY_ALIAS: ${{ secrets.AUDOIBOO_KEY_ALIAS }}
          AUDOIBOO_KEY_PASSWORD: ${{ secrets.AUDOIBOO_KEY_PASSWORD }}
        run: |
          test -n "$AUDOIBOO_KEYSTORE_B64"
          test -n "$AUDOIBOO_STORE_PASSWORD"
          test -n "$AUDOIBOO_KEY_ALIAS"
          test -n "$AUDOIBOO_KEY_PASSWORD"
          mkdir -p "$RUNNER_TEMP/audoiboo-signing"
          printf '%s' "$AUDOIBOO_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/audoiboo-signing/release.jks"
          keytool -list -keystore "$RUNNER_TEMP/audoiboo-signing/release.jks" -storepass "$AUDOIBOO_STORE_PASSWORD" -alias "$AUDOIBOO_KEY_ALIAS" >/dev/null

      - name: Build release APK
        if: github.event_name != 'pull_request'
        env:
          ORG_GRADLE_PROJECT_AUDOIBOO_STORE_FILE: ${{ runner.temp }}/audoiboo-signing/release.jks
          ORG_GRADLE_PROJECT_AUDOIBOO_STORE_PASSWORD: ${{ secrets.AUDOIBOO_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_AUDOIBOO_KEY_ALIAS: ${{ secrets.AUDOIBOO_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_AUDOIBOO_KEY_PASSWORD: ${{ secrets.AUDOIBOO_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/release/app-release.apk Audoiboo-Tracker-1.1.4-dev.apk

      - name: Upload workflow artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Audoiboo-Tracker-1.1.4-dev
          path: Audoiboo-Tracker-1.1.4-dev.apk

      - name: Publish dev prerelease
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_NOTES="Backup format 12 with Room downloads and rollback-safe restore; resilient download/reboot recovery and ZIP integrity checks; Media3 audiobook player with durable progress and broken-track recovery; SAF storage migration with collision-safe staging and stale URI rebinding; expanded unit and end-to-end regression coverage."
          if gh release view dev-player >/dev/null 2>&1; then
            git tag -f dev-player "$GITHUB_SHA"
            git push origin refs/tags/dev-player --force
            gh release upload dev-player Audoiboo-Tracker-1.1.4-dev.apk --clobber
            gh release edit dev-player --target "$GITHUB_SHA" --title "Audoiboo Tracker 1.1.4-dev" --prerelease --notes "$RELEASE_NOTES"
          else
            gh release create dev-player Audoiboo-Tracker-1.1.4-dev.apk --target "$GITHUB_SHA" --title "Audoiboo Tracker 1.1.4-dev" --prerelease --notes "$RELEASE_NOTES"
          fi

      - name: Remove signing key
        if: always() && github.event_name != 'pull_request'
        run: rm -rf "$RUNNER_TEMP/audoiboo-signing"
