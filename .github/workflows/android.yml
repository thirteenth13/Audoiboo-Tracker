name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Decode stable signing key
        run: |
          base64 -d .github/keys/audoiboo-release.keystore.b64 > .github/keys/audoiboo-release.jks
          keytool -list -keystore .github/keys/audoiboo-release.jks -storepass Audoiboo2026 -alias audoiboo >/dev/null

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Audoiboo-Tracker-1.0.0.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Audoiboo-Tracker-1.0.0
          path: Audoiboo-Tracker-1.0.0.apk

      - name: Publish stable release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.0.0 --yes --cleanup-tag || true
          gh release create v1.0.0 Audoiboo-Tracker-1.0.0.apk --target "$GITHUB_SHA" --title "Audoiboo Tracker 1.0.0" --notes "Stable release: series tracking, hidden archive discovery, managed resumable downloads, ZIP extraction, built-in Audioboo browser, configurable UI controls, local/Google Drive backup via Android document provider, and stable APK signing for future in-place updates."
