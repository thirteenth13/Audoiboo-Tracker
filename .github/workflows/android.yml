name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Decode stable signing key
        run: |
          base64 -d .github/keys/audoiboo-release.keystore.b64 > .github/keys/audoiboo-release.jks
          keytool -list -keystore .github/keys/audoiboo-release.jks -storepass Audoiboo2026 -alias audoiboo >/dev/null

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Audoiboo-Tracker-1.1.3-dev.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Audoiboo-Tracker-1.1.3-dev
          path: Audoiboo-Tracker-1.1.3-dev.apk

      - name: Publish dev prerelease
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-player --yes --cleanup-tag || true
          gh release create dev-player Audoiboo-Tracker-1.1.3-dev.apk --target "$GITHUB_SHA" --title "Audoiboo Tracker 1.1.3-dev" --prerelease --notes "Reliability and player update: WorkManager scheduling over foreground downloader, reboot recovery, ZIP integrity checks, JSoup/WebView/manual parser fallback, SAF library folder, exact playback-state restore, broken-track skip, per-book speed, Voice Boost, Android Auto MediaLibraryService, WebDAV metadata sync, series monitoring/auto-download, tags and smart library lists, Markdown bookmark export, and advanced sleep timer with 15/30/45/60 minutes, end-of-file/book/series modes and fade-out."
