name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build dev APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Audoiboo-Tracker-0.3.0-dev.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Audoiboo-Tracker-0.3.0-dev
          path: Audoiboo-Tracker-0.3.0-dev.apk

      - name: Publish rolling dev release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev Audoiboo-Tracker-0.3.0-dev.apk --target "$GITHUB_SHA" --prerelease --title "Audoiboo Tracker 0.3.0-dev" --notes "Development build"
