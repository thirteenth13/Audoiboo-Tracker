name: Scrapling experiment

on:
  push:
    branches:
      - experiment/scrapling-parser-backend
    paths:
      - 'experiments/scrapling/**'
      - '.github/workflows/scrapling-experiment.yml'
  workflow_dispatch:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/scrapling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/scrapling/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: pytest -q

  live-probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/scrapling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/scrapling/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: scrapling install
      - run: python live_probe.py
