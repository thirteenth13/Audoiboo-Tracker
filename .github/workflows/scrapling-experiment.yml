name: Scrapling experiment

on:
  push:
    branches:
      - experiment/scrapling-parser-backend
    paths:
      - 'experiments/scrapling/**'
      - '.github/workflows/scrapling-experiment.yml'
  workflow_dispatch:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/scrapling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/scrapling/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: pytest -q

  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: experiments/scrapling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/scrapling/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: scrapling install
      - name: Install Xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb
      - name: Run live probe in headful Chromium
        env:
          KV_HEADLESS: '0'
          KV_ARTIFACT_DIR: artifacts/knigavuhe
        run: xvfb-run -a -s '-screen 0 1440x1200x24' python live_probe.py
      - name: Upload Knigavuhe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knigavuhe-browser-diagnostics
          path: experiments/scrapling/artifacts/knigavuhe/
          if-no-files-found: warn
          retention-days: 7
