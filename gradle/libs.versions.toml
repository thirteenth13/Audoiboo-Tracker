[versions]
agp = "9.3.0"
kotlin = "2.3.21"
ksp = "2.3.9"
coreKtx = "1.19.0"
activityCompose = "1.13.0"
composeBom = "2026.08.00"
documentfile = "1.1.0"
coil = "3.3.0"
media3 = "1.8.0"
guava = "33.4.8-android"
work = "2.10.5"
jsoup = "1.21.2"
room = "2.8.0"
datastore = "1.1.7"
paging = "3.3.6"
